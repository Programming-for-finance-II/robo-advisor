# .github/workflows/agent_pr.yml
#
# AI Agent — Auto-generate docstrings for optimizer module
#
# Trigger: manual dispatch (workflow_dispatch) or push to backend/optimizer/
# What it does:
#   1. Checks out the repo
#   2. Reads all Python files in backend/optimizer/
#   3. Calls Claude API to generate/update docstrings
#   4. Commits the changes to a new branch
#   5. Opens a PR automatically with a descriptive body
#
# Evidence for AGENTS.md: the PR URL generated by this workflow
# is the proof of the AI agent criterion (Criterion 5).

name: AI Agent — Optimizer Docstrings PR

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/optimizer/**"

jobs:
  generate-docstrings:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install anthropic SDK
        run: pip install anthropic

      - name: Run AI agent — generate docstrings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          import anthropic
          from pathlib import Path

          client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])

          optimizer_dir = Path("backend/optimizer")
          py_files = list(optimizer_dir.glob("*.py"))

          for filepath in py_files:
              source = filepath.read_text()
              if not source.strip():
                  continue

              print(f"Processing {filepath}...")

              message = client.messages.create(
                  model="claude-sonnet-4-5",
                  max_tokens=1000,
                  messages=[
                      {
                          "role": "user",
                          "content": (
                              f"You are a Python documentation assistant.\n"
                              f"Add or improve docstrings for all public functions "
                              f"and classes in the following Python file.\n"
                              f"Return ONLY the complete updated Python file, "
                              f"no explanation, no markdown fences.\n\n"
                              f"File: {filepath.name}\n\n{source}"
                          ),
                      }
                  ],
              )

              updated = message.content[0].text
              filepath.write_text(updated)
              print(f"  Done — {message.usage.output_tokens} tokens used")

          print("All files processed.")
          EOF

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git checkout -b agent/optimizer-docstrings-${{ github.run_number }}
          git add backend/optimizer/
          git diff --cached --quiet || git commit -m "docs(agent): auto-generate optimizer docstrings via Claude API"

      - name: Push branch
        run: |
          git push origin agent/optimizer-docstrings-${{ github.run_number }}

      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "docs(agent): auto-generated optimizer docstrings [AI agent]" \
            --body "## AI Agent PR

          This PR was automatically generated by the \`agent_pr.yml\` GitHub Actions workflow.

          **What changed:** Docstrings added/improved in \`backend/optimizer/\` via Claude API (\`claude-sonnet-4-20250514\`).

          **Trigger:** \`${{ github.event_name }}\` on run \`${{ github.run_number }}\`

          **Evidence for AGENTS.md:** This PR URL is the proof of the AI agent criterion (Criterion 5).

          > This PR was opened automatically by a GitHub Actions workflow calling the Anthropic Claude API." \
            --base main \
            --head agent/optimizer-docstrings-${{ github.run_number }}