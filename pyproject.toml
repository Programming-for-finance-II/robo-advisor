[project]
name = "robo-advisor"
version = "0.1.0"
description = "AI-Powered Robo-Advisor Platform — Programming in Finance II 2026 (USI)"
requires-python = ">=3.11"

dependencies = [
    "yfinance>=0.2.54",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "PyPortfolioOpt>=1.5.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "slowapi>=0.1.9",
    "streamlit>=1.35.0",
    "anthropic>=0.28.0",
    "scikit-learn>=1.5.0",
    "shap>=0.45.0",
    "plotly>=5.22.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]


