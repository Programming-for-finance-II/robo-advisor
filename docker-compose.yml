# docker-compose.yml
# Local development environment for the Robo-Advisor Platform
# Usage: docker-compose up
# Requires: Docker Desktop, .env file with ANTHROPIC_API_KEY and API_KEY

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - sqlite_data:/app/data
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
